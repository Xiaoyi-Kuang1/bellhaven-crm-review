}.item small{display:block;font-size:14px;color:var(--muted);margin-top:5px;line-height:1.5}.item.selected .item-title{color:#ffffff}.item-status{font-size:16px;color:#507762}#detail{background:#fff;border-radius:14px;padding:36px 40px;min-height:540px}.detail-meta{display:flex;gap:14px;align-items:center}.badge{font-size:14px;color:var(--muted)}.detail-meta .badge:first-child{color:#39745d;background:#edf6f1;padding:5px 9px;border-radius:5px}.detail-meta .badge.rejected{background:#f8efe6;color:#8a673b}h2{font-size:30px;font-weight:600;letter-spacing:-.8px;line-height:1.3;margin:20px 0 12px}.location-line{font-size:16px;color:var(--muted);line-height:1.6;margin:0 0 28px}.detail-tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);margin-bottom:26px}.detail-tabs button{border:0;background:none;border-radius:0;padding:13px 0;color:var(--muted);font-size:15px;border-bottom:2px solid transparent}.detail-tabs button[aria-pressed=true]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:16px}th{text-align:left;color:var(--muted);font-size:14px;font-weight:500;padding:12px 12px;background:#f7f4e9}td{padding:20px 12px;vertical-align:top;line-height:1.65;border-bottom:1px solid var(--line);overflow-wrap:anywhere}td small{font-size:14px;color:var(--muted)}.changes th:first-child{width:24%}.changes td:first-child{color:var(--muted);font-size:15px}.changes td:nth-child(2){color:var(--muted)}.changes td:last-child{color:#315f4c;font-weight:500}.muted{color:var(--muted);font-size:14px;overflow-wrap:anywhere;line-height:1.6}h3{font-size:16px;font-weight:600;margin:28px 0 14px}summary{font-size:15px;color:var(--muted);line-height:1.6}.reason,.source-card p{font-size:16px;line-height:1.75;color:#34473e;margin:18px 0}.source-card h3{display:none}.source-card a{font-size:15px}.source-card details,.evidence details{margin-top:22px}.evidence{margin:0}.evidence>summary{display:none}pre{font-size:14px;background:#f7f4e9;padding:18px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:300px;overflow:auto}.warning{font-size:15px;line-height:1.65;border-left:3px solid #b7904d;padding:4px 16px;color:#755c32;margin:24px 0}.decision-receipt{margin-top:28px;padding-top:22px;border-top:1px solid var(--line)}.decision-receipt .badge{color:#39745d;font-size:15px;font-weight:550}.decision-receipt .badge.rejected{color:#8a673b}.decision-receipt details{margin-top:12px}.decision-receipt p{font-size:16px;line-height:1.75;color:#34473e;margin:14px 0}.actions{margin-top:28px}.actions label{font-size:15px}textarea{width:100%;display:block;border:1px solid #d3d9cf;border-radius:8px;padding:14px;min-height:100px;resize:vertical;margin:12px 0 16px;font-size:16px}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.history-panel{margin:24px 0 0 356px;padding:0 10px}#history p{font-size:15px;line-height:1.75;padding:18px 0;border-bottom:1px solid var(--line);color:var(--muted)}#history small{font-size:14px}.field-note{font-weight:400}.field-note p{white-space:pre-wrap;margin:12px 0;font-size:15px}.account-id{margin-top:5px}.account-id summary{font-size:14px}.account-id small{display:block;margin-top:7px}#notice{display:none;padding:16px;background:#fff9ec;margin-bottom:20px;font-size:15px}.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:400px}.empty h2{font-size:26px;margin:0 0 24px}.no-results{font-size:15px;color:var(--muted);padding:20px 12px}

/* A warm paper canvas with a forest-green arch as the brand signature. */
header{background:#fffdf7;border-bottom:0;position:relative;height:88px}header:after{content:"";position:absolute;bottom:0;left:36px;right:36px;height:1px;background:#dcdccc}
.brand-mark{background:#165640;color:#fff7de;width:42px;height:48px;border-radius:23px 23px 4px 4px;padding:5px}.brand-mark svg{width:100%;height:100%}.brand-name{font-family:Georgia,"Times New Roman",serif;font-size:27px;font-weight:500;letter-spacing:-1px;color:#173e2e}
.stat{color:#53645c}.stat.active{color:#fff;background:#165640}.stat.active b{color:#f1d38c}.stat.active:hover{background:#214c3c}.item.selected{background:#165640;box-shadow:inset 3px 0 #dfb860}.item.selected .item-title{color:#fffdf7}.item.selected small,.item.selected .item-status{color:#e0eadc}.item-title{color:#223e31}.item-status{color:#38634b}

main{max-width:1280px;padding:42px 48px}.page-heading{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:34px;gap:24px}.eyebrow{font-size:12px;letter-spacing:2px;color:#596c5e;font-weight:600;margin:0 0 12px}h1{font-family:Georgia,"Times New Roman",serif;font-size:48px;line-height:1.1;font-weight:400;letter-spacing:-1.8px;margin:0;color:#193e2c}h1 span{color:#b88e37}.queue-summary{font-size:15px;color:#53645c;margin:0 0 5px}.stats{margin-bottom:32px}.layout{display:block}.queue-panel{position:static}.queue-heading{display:flex;justify-content:space-between;align-items:center;gap:24px;margin-bottom:24px}.queue-heading strong{font-size:20px;margin:0}.search-wrap{width:300px}.list{max-height:none;min-height:0;overflow:visible;padding:0}.list-columns,.item{display:grid;grid-template-columns:minmax(0,1fr) 160px 100px 24px;gap:24px;align-items:center}.list-columns{padding:0 18px 14px;border-bottom:1px solid #dcdccc;font-size:13px;color:#53645c}.item{border-radius:0;padding:22px 18px;margin:0;border-bottom:1px solid #e8e6da;background:transparent}.item:hover,.item:focus-visible{background:#f5f2e6}.item-title{font-size:17px;font-weight:550}.item small{margin-top:5px;font-size:14px}.row-change{font-size:15px;color:#53645c}.row-status{font-size:14px;color:#53645c}.row-status:before{content:"";display:inline-block;width:6px;height:6px;background:#52825e;border-radius:50%;margin-right:9px;vertical-align:middle}.row-status.rejected:before{background:#ab8246}.row-status.pending:before{background:#b38a31}.row-status.failed:before{background:#b34a3d}.row-arrow{color:#5d765e;font-size:20px}.history-panel{margin:30px 0 0;padding:0 18px}
#reviewDrawer{position:fixed;inset:0 0 0 auto;margin:0;width:min(800px,94vw);height:100dvh;max-width:none;max-height:none;padding:0;border:0;border-left:3px solid #d9b464;background:white;box-shadow:-20px 0 80px #173e2e1f;color:#192f29;overflow:auto}#reviewDrawer::backdrop{background:#193e2c45;backdrop-filter:blur(2px)}.drawer-top{display:flex;align-items:center;justify-content:space-between;padding:20px 32px;background:#fffdf7;border-bottom:1px solid #e8e6da;position:sticky;top:0;z-index:1;font-size:14px;color:#53645c}.drawer-top button{border:0;background:none;padding:8px;font-size:15px}#detail{border:0;border-radius:0;box-shadow:none;padding:32px;min-height:0}.empty{min-height:200px}

</style></head><body>
<header><div class="brand"><div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 36 40" fill="none"><path d="M6 35V17a12 12 0 0 1 24 0v18" stroke="currentColor" stroke-width="3"/><path d="M12 35V23a6 6 0 0 1 12 0v12M2 35h32" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="12" r="3" fill="#dfb860"/></svg></div><div><div class="brand-name">Bellhaven</div><small>Community review</small></div></div><div class="header-tools"><span id="mode">Connecting</span><button id="recordDemo">Record demo</button></div></header>
<main><div class="page-heading"><div><p class="eyebrow">COMMUNITY OPERATIONS</p><h1>Review queue<span>.</span></h1></div><p class="queue-summary" id="queueSummary"></p></div><div class="stats" id="stats"></div><div id="notice" role="alert"></div><div class="layout"><aside class="panel queue-panel"><div class="queue-heading"><strong>Communities</strong><span id="queueCount" class="queue-count"></span><div class="search-wrap"><input id="search" placeholder="Search communities…" aria-label="Search proposals"></div><select hidden id="filter" aria-label="Filter status"><option value="pending">Pending review</option><option value="all">All decisions</option><option value="applied">Applied</option><option value="rejected">Rejected</option><option value="failed">Failed</option></select></div><div class="list-columns" aria-hidden="true"><span>Community</span><span>Change</span><span>Status</span><span></span></div><div id="list" class="list"></div></aside><dialog id="reviewDrawer" aria-label="Proposal review"><div class="drawer-top"><span>Proposal review</span><button id="closeDrawer" aria-label="Close proposal">Close ×</button></div><section id="detail" class="panel" aria-label="Proposal details"></section></dialog></div><details class="panel history-panel"><summary>Activity history</summary><div id="history"></div><button id="moreHistory" hidden>Load more</button></details></main>
<script>
let data,selected,busy=false,initialized=false,historyRows=[],historyCursor=null,historyProposal=null;
const el=id=>document.getElementById(id);const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const display=v=>v&&typeof v==='object'&&v.ref?'ID of the new account created above':(typeof v==='object'?JSON.stringify(v):String(v??'—')||'—');

function actionLabel(p){
 if(p.kind==='update'){
  const fields=p.operations.flatMap(op=>Object.keys(op.fields));
  if(fields.length===1&&fields[0]==='name')return 'Rename';
  return 'Update fields';
 }
 return {create:'New account',reparent:'Reparent',chow:'CHOW',duplicate:'Duplicate',not_on_website:'Not on website',manual_review:'Manual review'}[p.kind]||p.kind.replaceAll('_',' ');
}
const fieldLabels={name:'Account name',parent_id:'Parent account',billing_street:'Billing address',billing_city:'City',billing_state:'State',billing_zip:'ZIP code',care_type:'Care type',status:'Status',note:'Note',duplicate_of_account:'Duplicate of',chow_current_account:'Current CHOW account'};

function accountValue(field,value,account){
 if(!['parent_id','duplicate_of_account','chow_current_account'].includes(field)||!value||typeof value!=='string')return esc(display(value));
 let name=field==='parent_id'&&account?.parent_id===value?account.parent_name:null;
 for(const proposal of data.proposals){
  for(const row of proposal.evidence.accounts){
   if(row.account_id===value)name=name||row.name;
   if(row.parent_id===value)name=name||row.parent_name;
  }
 }
 return name?`${esc(name)}<details class="account-id"><summary>Account ID</summary><small>${esc(value)}</small></details>`:esc(value);
}
function fieldValue(field,value,account){
 if(field==='note'&&value)return `<details class="field-note"><summary>Read note</summary><p>${esc(display(value))}</p></details>`;
 return accountValue(field,value,account);
}
function render(){
 const counts={};data.proposals.forEach(p=>counts[p.status]=(counts[p.status]||0)+1);
 el('mode').textContent=data.writes_enabled?'Live CRM':'Read-only preview';
 el('stats').innerHTML=['all','pending','applied','rejected','failed'].map(s=>`<button class="stat ${s} ${el('filter').value===s?'active':''}" data-status="${s}" aria-label="Show ${s} proposals" aria-pressed="${el('filter').value===s}"><span class="stat-icon" aria-hidden="true">${{all:'▦',pending:'◷',applied:'✓',rejected:'⊘',failed:'!'}[s]}</span><small>${s==='all'?'All':s==='pending'?'Pending':s.charAt(0).toUpperCase()+s.slice(1)}</small><b>${s==='all'?data.proposals.length:(counts[s]||0)}</b></button>`).join('');
 el('stats').querySelectorAll('button').forEach(b=>b.onclick=()=>{el('filter').value=b.dataset.status;selected=null;render()});
 el('history').innerHTML=historyRows.map(e=>`<p><span class="badge">${esc(e.action)}</span> ${esc(e.created_at)} — ${esc(e.reason)} <small>${esc(e.proposal_id.slice(0,12))}</small></p>`).join('')||'<p>No decisions yet.</p>';
 let items=data.proposals.filter(p=>(el('filter').value==='all'||p.status===el('filter').value)&&(`${p.title} ${p.kind} ${actionLabel(p)}`).toLowerCase().includes(el('search').value.toLowerCase()));
 if(!items.some(p=>p.id===selected))selected=null;
 el('queueCount').textContent=items.length+' shown';
 el('queueSummary').textContent=(counts.pending||0)?`${counts.pending} awaiting review`:`${counts.applied||0} synced · ${counts.rejected||0} rejected`;
 el('list').innerHTML=items.map(p=>`<button class="item" data-id="${p.id}" aria-haspopup="dialog"><span class="item-text"><span class="item-title">${esc(p.title)}</span><small>${p.kind==='duplicate'?esc(p.evidence.accounts[0]?.name||'')+' · '+esc(p.evidence.accounts[0]?.account_id.slice(-6)):p.evidence.community?esc(p.evidence.community.city+', '+p.evidence.community.state):'Website listing not found'}</small></span><span class="row-change">${esc(actionLabel(p))}</span><span class="row-status ${esc(p.status)}">${esc({applied:'Synced',rejected:'Rejected',pending:'To review',failed:'Failed'}[p.status]||p.status)}</span><span class="row-arrow" aria-hidden="true">↗</span></button>`).join('')||`<p class="no-results">${el('filter').value==='pending'&&!el('search').value?'All caught up. No proposals awaiting review.':'No matching proposals.'}</p>`;
 el('list').querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=b.dataset.id;render();el('reviewDrawer').insertBefore(el('notice'),el('detail'));el('reviewDrawer').showModal();el('closeDrawer').focus()});
 const p=items.find(p=>p.id===selected);if(!p){if(el('reviewDrawer').open)el('reviewDrawer').close();el('detail').innerHTML='';return}
 const c=p.evidence.community;const accounts=p.evidence.accounts;
 el('detail').innerHTML=`<div class="detail-meta"><span class="badge ${esc(p.status)}">${esc({applied:'Synced',rejected:'Rejected',pending:'Needs review',failed:'Sync failed'}[p.status]||p.status)}</span><span class="badge">${esc(actionLabel(p))}</span></div><h2>${esc(p.title)}</h2><p class="location-line">${esc(c?[c.street,c.city,c.state+' '+c.zip].join(', '):'Not listed on the current website')}</p>
 <nav class="detail-tabs" aria-label="Proposal sections"><button data-section="changes" aria-pressed="true">Changes</button><button data-section="evidence" aria-pressed="false">Evidence</button><button data-section="history" aria-pressed="false">History</button></nav>
 ${p.kind==='chow'?'<div class="warning"><strong>Billing protection applies.</strong> Create a new current account. Keep the original parent and billing history, and set only the CHOW link on the original.</div>':''}

 <div id="changesView">${p.operations.map(op=>{const a=accounts.find(a=>a.account_id===op.account_id)||{};return `${p.operations.length>1?`<p class="muted">${op.type==='create'?'Create account':'Update '+esc(a.name||op.account_id)}</p>`:''}<div class="table-wrap"><table class="changes"><tr><th>Field</th><th>Before</th><th>${p.status==='applied'?'Approved':p.status==='rejected'?'Not applied':'Proposed'}</th></tr>${Object.entries(op.fields).map(([k,v])=>`<tr><td>${esc(fieldLabels[k]||k)}</td><td>${op.type==='create'?'—':fieldValue(k,a[k],a)}</td><td>${fieldValue(k,v,null)}</td></tr>`).join('')}</table></div>`}).join('')||'<p>Investigation required. No executable changes.</p>'}
 ${p.depends_on.length?`<p class="warning">Prerequisites: ${p.depends_on.map(id=>esc(data.proposals.find(x=>x.id===id)?.title||id)).join(', ')}. Apply these first.</p>`:''}
 </div><div id="evidenceView" hidden><details class="evidence" open><summary>Evidence & billing details</summary><p class="muted">${esc(p.confidence)} confidence · ${p.id.slice(0,12)}</p><p class="reason">${esc(p.evidence.reason)}</p>${c?`<div class="source-card"><h3>Website evidence</h3><p>${esc(c.street)}, ${esc(c.city)}, ${esc(c.state)} ${esc(c.zip)}<br>${esc(c.care_offerings.join(' · '))}</p><a href="${esc(c.source_url)}" target="_blank" rel="noopener">Open community source ↗</a><details><summary>Archived source fingerprint</summary><p class="muted">SHA-256: ${esc(c.source_sha256)}</p></details></div>`:'<div class="warning">Not found in the verified complete website crawl. Absence alone does not establish closure or sale.</div>'} <h3>Account & billing evidence</h3><div class="table-wrap"><table><tr><th>Account</th><th>Parent</th><th>Lifetime revenue</th><th>Outstanding AR</th></tr>${accounts.map(a=>`<tr><td>${esc(a.name)}<br><small>${esc(a.account_id)}</small></td><td>${esc(a.parent_name||a.parent_id||'Unassigned')}</td><td>$${Number(a.lifetime_revenue).toLocaleString()}</td><td>$${Number(a.outstanding_ar).toLocaleString()}</td></tr>`).join('')}</table></div><details><summary>Original records</summary><pre>${esc(JSON.stringify(p.evidence,null,2))}</pre></details></details></div>
 ${p.status==='pending'?`<div class="actions"><label for="reason">Review rationale</label><textarea id="reason" placeholder="Explain the evidence supporting your decision."></textarea><button id="approve" class="primary" ${busy||!data.writes_enabled||!p.operations.length?'disabled':''}>Approve & sync to CRM</button> <button id="reject" ${busy?'disabled':''}>Reject proposal</button></div>`:`<div class="decision-receipt"><span class="badge ${esc(p.status)}">${esc(p.status==='applied'?'Approved & synced':p.status==='rejected'?'Rejected':p.status)}</span><details><summary>Decision rationale</summary><p>${esc(p.decision?.reason||'See execution history for this proposal.')}</p></details>${p.status==='failed'?'<p><button id="retry">Retry approved operation</button></p>':''}</div>`}`;
 el('detail').insertAdjacentHTML('beforeend','<div id="historyView" hidden><div id="proposalEvents"></div><button id="moreProposalHistory" hidden>Load more</button></div>');
 el('detail').querySelectorAll('[data-section]').forEach(button=>button.onclick=()=>{
  const section=button.dataset.section;
  el('detail').querySelectorAll('[data-section]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
  for(const name of ['changes','evidence','history'])el(name+'View').hidden=name!==section;
  const receipt=el('detail').querySelector('.decision-receipt');if(receipt)receipt.hidden=section!=='changes';
  if(section==='history'){historyProposal=p.id;loadHistory(true,true)}
 });
 if(el('approve'))el('approve').onclick=()=>decide('approve');if(el('reject'))el('reject').onclick=()=>decide('reject');if(el('retry'))el('retry').onclick=()=>submit('/api/retry',{id:selected});
}
let proposalCursor=null,proposalRows=[];
async function loadHistory(reset, scoped){
 const ident=scoped?historyProposal:null;
 const cursor=reset?null:(scoped?proposalCursor:historyCursor);
 const query=new URLSearchParams();if(ident)query.set('proposal_id',ident);if(cursor)query.set('before',cursor);
 try{
  const r=await fetch('/api/history?'+query);if(!r.ok)throw new Error('History unavailable');const page=await r.json();
  if(scoped){
   if(selected!==ident||!el('proposalEvents'))return;
   proposalRows=reset?page.events:proposalRows.concat(page.events);proposalCursor=page.next_cursor;
   el('proposalEvents').innerHTML=proposalRows.map(e=>`<p class="reason">${esc(e.created_at)} · ${esc(e.action)}<br>${esc(e.reason)}</p>`).join('')||'<p>No events yet.</p>';
   el('moreProposalHistory').hidden=!proposalCursor;el('moreProposalHistory').onclick=()=>loadHistory(false,true);
  }else{
   historyRows=reset?page.events:historyRows.concat(page.events);historyCursor=page.next_cursor;
   el('history').innerHTML=historyRows.map(e=>`<p><span class="badge">${esc(e.action)}</span> ${esc(e.created_at)} — ${esc(e.reason)}</p>`).join('')||'<p>No events yet.</p>';
   el('moreHistory').hidden=!historyCursor;
  }
 }catch(e){const target=el(scoped?'proposalEvents':'history');if(target)target.textContent='Unable to load history. Refresh to retry.'}
}
el('moreHistory').onclick=()=>loadHistory(false,false);
async function refresh(){const r=await fetch('/api/queue');data=await r.json();await loadHistory(true,false);if(!initialized){if(!data.proposals.some(p=>p.status==='pending'))el('filter').value='all';initialized=true}render()}
async function decide(action){const reason=el('reason').value.trim();if(!reason){el('notice').style.display='block';el('notice').textContent='Enter a review rationale before deciding.';return}await submit('/api/decide',{id:selected,action,reason})}
async function submit(path,body){busy=true;el('notice').style.display='block';el('notice').textContent='Processing. Keep this page open.';render();try{const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':data.csrf},body:JSON.stringify(body)});const result=await r.json();el('notice').textContent=r.ok?'Decision recorded. Review the updated status below.':result.error}catch(e){el('notice').textContent='Connection interrupted. Refresh to inspect the recorded outcome before retrying.'}busy=false;await refresh()}
let recording=null,recordingStream=null,recordingParts=[];
el('recordDemo').onclick=async()=>{
 if(recording&&recording.state==='recording'){recording.stop();return}
 try{
  recordingStream=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:15},audio:false,preferCurrentTab:true});
  recordingParts=[];recording=new MediaRecorder(recordingStream,{mimeType:'video/webm'});
  recording.ondataavailable=e=>{if(e.data.size)recordingParts.push(e.data)};
  recording.onstop=()=>{recordingStream.getTracks().forEach(t=>t.stop());const url=URL.createObjectURL(new Blob(recordingParts,{type:'video/webm'}));const link=document.createElement('a');link.href=url;link.download='bellhaven-review-demo.webm';link.click();el('recordDemo').textContent='Record demo';};
  recordingStream.getVideoTracks()[0].onended=()=>{if(recording.state==='recording')recording.stop()};
  recording.start(1000);el('recordDemo').textContent='Stop & save recording';
 }catch(e){el('notice').style.display='block';el('notice').textContent='Recording could not start: '+e.message;}
};
el('closeDrawer').onclick=()=>el('reviewDrawer').close();
el('reviewDrawer').addEventListener('close',()=>{document.querySelector('main').insertBefore(el('notice'),document.querySelector('.layout'));const row=Array.from(el('list').querySelectorAll('button')).find(b=>b.dataset.id===selected);if(row)row.focus()});
el('search').oninput=render;el('filter').onchange=()=>{selected=null;render()};refresh();
</script></body></html>
